[project]
name = "keykeep"
version = "0.1.0"
description = "A roguelike tower defence that teaches touch typing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    "email-validator>=2,<3",
    "redis>=5,<9",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<27",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "fakeredis>=2.26,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
